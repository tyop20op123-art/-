# בונה קובץ APK לאנדרואיד בכל עדכון, ומפרסם אותו בקישור הורדה קבוע:
# https://github.com/<owner>/<repo>/releases/latest/download/tovana.apk
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web app into www/
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js css js data icons www/

      - name: Install Capacitor
        run: npm install --no-save --no-audit --no-fund @capacitor/cli@6.1.2 @capacitor/core@6.1.2 @capacitor/android@6.1.2

      - name: Create Android project
        run: npx cap add android

      - name: App icon
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          src = Image.open("icons/maskable-512.png").convert("RGBA")
          res = "android/app/src/main/res"
          for folder, size in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              d = f"{res}/mipmap-{folder}"
              os.makedirs(d, exist_ok=True)
              img = src.resize((size, size), Image.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  img.save(f"{d}/{name}")
          # use the plain PNG icons instead of the default adaptive icon
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          PY

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tovana.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tovana-apk
          path: tovana.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: תובנה – גרסה ${{ github.run_number }}
          make_latest: true
          files: tovana.apk
          body: |
            להתקנה בטלפון אנדרואיד: הורידו את tovana.apk ופתחו אותו.
            אם הטלפון שואל – אשרו "התקנה ממקורות לא ידועים".
