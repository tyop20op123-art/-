<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0e11" />
  <meta name="description" content="תובנה – פיד אינסופי של כרטיסיות ידע: פילוסופיה, מדע, טכנולוגיה ויהדות." />
  <title>תובנה · כרטיסיות ידע</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="תובנה" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101114'/%3E%3Cpath d='M20 18h24v6H35v24h-6V24h-9z' fill='%23e9c46a'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand" aria-label="תובנה">
        <span class="brand-mark">ת</span>
        <span class="brand-name">תובנה</span>
      </div>

      <button class="goal" id="goalBtn" aria-label="יעד יומי">
        <svg class="goal-ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle cx="18" cy="18" r="15" class="ring-bg" />
          <circle cx="18" cy="18" r="15" class="ring-fg" id="goalRing" />
        </svg>
        <span class="goal-text" id="goalText">קראת 0 מתוך 5 היום</span>
        <span class="streak" id="streak" title="רצף ימים">🔥 0</span>
      </button>

      <div class="top-actions">
        <button class="install-btn" id="installBtn" hidden>התקנה</button>
        <button class="icon-btn account-btn" id="accountBtn" aria-label="החשבון שלי" title="החשבון שלי" hidden>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span class="avatar" id="accountAvatar" hidden></span>
        </button>
        <button class="icon-btn" id="libraryBtn" aria-label="הספרייה שלי" title="הספרייה שלי">
          <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
          <span class="badge" id="savedCount" hidden>0</span>
        </button>
        <button class="icon-btn" id="prefsBtn" aria-label="תחומי עניין והגדרות" title="תחומי עניין">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="מעבר בין מצב כהה ובהיר" title="מצב תצוגה">
          <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="קטגוריות"></nav>
  </header>

  <main class="feed" id="feed" aria-live="polite"></main>

  <div class="kbd-hint" id="kbdHint">↑ ↓ ניווט · <b>B</b> שמירה · <b>L</b> אהבתי · <b>D</b> העמק</div>

  <!-- חלונית כללית (העמק עוד / ספרייה / ספר / העדפות) -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button class="icon-btn" id="sheetClose" aria-label="סגירה">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/seed.js"></script>
  <script src="js/seed-emunah.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/app.js"></script>
  <script src="js/backend-config.js"></script>
  <script type="module" src="js/account.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
